<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Arts - Eternal Shadows</title>
    <style>
        :root {
            --bg-color: #000000;
            --secondary-bg: #1a0033;
            --text-color: #E0E0E0;
            --accent-color: #BB86FC;
            --card-bg: #121212;
            --shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
            --nav-bg: linear-gradient(135deg, #000000 0%, #2d004d 100%);
            --btn-text: #ffffff;
        }

        [data-theme="light"] {
            --bg-color: #FFFFFF;
            --secondary-bg: #F5F5DC; /* Beige */
            --text-color: #333333;
            --accent-color: #8B4513;
            --card-bg: #FFFFFF;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
            --nav-bg: #F5F5DC;
            --btn-text: #8B4513;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            background: var(--nav-bg);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        .settings-btn {
            background: none;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        .settings-btn:hover {
            background: var(--accent-color);
            color: white;
        }

        main {
            padding: 2rem 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .manga-info {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            margin-bottom: 3rem;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        .manga-cover {
            flex: 1;
            min-width: 280px;
            max-width: 350px;
        }

        .manga-cover img {
            width: 100%;
            border-radius: 10px;
            box-shadow: var(--shadow);
        }

        .manga-details {
            flex: 2;
            min-width: 300px;
        }

        .manga-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--accent-color);
        }

        .status-badge {
            display: inline-block;
            padding: 0.2rem 1rem;
            background: var(--accent-color);
            color: white;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .description {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .read-btn {
            display: inline-block;
            background: var(--accent-color);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .read-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        /* Reader Section */
        #reader-section {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 2rem;
        }

        .page-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 10px;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .page-container img {
            width: 100%;
            display: block;
            border-radius: 5px;
        }

        .reader-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        /* Modal Settings */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            position: relative;
            box-shadow: var(--shadow);
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            left: 1rem;
            cursor: pointer;
            font-size: 1.5rem;
        }

        .setting-item {
            margin: 1.5rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #555;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-color);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        @media (max-width: 768px) {
            .manga-info {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .manga-cover {
                max-width: 100%;
            }
        }
    </style>
</head>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="toggleModal()">&times;</span>
            <h2 style="margin-bottom: 1rem;">الإعدادات</h2>
            <div class="setting-item">
                <span>الوضع الفاتح</span>
                <label class="switch">
                    <input type="checkbox" id="themeToggle" onchange="changeTheme()">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <script>
        function toggleModal() {
            const modal = document.getElementById('settingsModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function changeTheme() {
            const checkbox = document.getElementById('themeToggle');
            const body = document.body;
            // checkbox checked means LIGHT mode in this new logic
            if (checkbox.checked) {
                body.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        function startReading() {
            document.getElementById('home-section').style.display = 'none';
            document.getElementById('reader-section').style.display = 'flex';
            window.scrollTo(0, 0);
        }

        function showHome() {
            document.getElementById('home-section').style.display = 'flex';
            document.getElementById('reader-section').style.display = 'none';
            window.scrollTo(0, 0);
        }

        // Load saved theme or default to dark
        window.onload = () => {
            const savedTheme = localStorage.getItem('theme');
            const checkbox = document.getElementById('themeToggle');
            
            if (savedTheme === 'light') {
                checkbox.checked = true;
                document.body.setAttribute('data-theme', 'light');
            } else {
                checkbox.checked = false;
                document.body.setAttribute('data-theme', 'dark');
            }
        };

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('settingsModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
